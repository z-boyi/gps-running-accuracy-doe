<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_EN}}</title>
<style>
{{CSS}}
{{CODE_CSS}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand" data-lang="en">GPS running accuracy · DOE</span>
  <span class="brand" data-lang="zh">GPS 跑步测距 · 实验设计</span>
  <span class="spacer"></span>
  <button type="button" class="code-toggle" data-code-toggle>
    <span data-lang="en">Expand all code</span><span data-lang="zh">展开全部代码</span>
  </button>
  <a class="repo" href="https://github.com/z-boyi/gps-running-accuracy-doe">GitHub</a>
  <div class="switch" role="group" aria-label="Language">
    <button type="button" data-set-lang="en">English</button>
    <button type="button" data-set-lang="zh">中文</button>
  </div>
</header>
<div class="layout">
  <aside class="toc">
    <nav data-lang="en"><div class="toc-head"><p class="toc-title">Contents</p><button type="button" class="toc-all" data-toc-all aria-pressed="false" data-open="Expand all" data-close="Collapse all">Expand all</button></div>{{TOC_EN}}</nav>
    <nav data-lang="zh"><div class="toc-head"><p class="toc-title">目录</p><button type="button" class="toc-all" data-toc-all aria-pressed="false" data-open="全部展开" data-close="全部收起">全部展开</button></div>{{TOC_ZH}}</nav>
  </aside>
  <main>
    <article data-lang="en" lang="en"><h1>{{TITLE_EN}}</h1>{{BODY_EN}}</article>
    <article data-lang="zh" lang="zh-CN"><h1>{{TITLE_ZH}}</h1>{{BODY_ZH}}</article>
  </main>
</div>
<script>
(function () {
  var titles = { en: {{TITLE_EN_JS}}, zh: {{TITLE_ZH_JS}} };
  function setLang(lang, save) {
    if (lang !== "zh") lang = "en";
    document.documentElement.setAttribute("data-current", lang);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = titles[lang];
    var buttons = document.querySelectorAll("[data-set-lang]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-set-lang") === lang);
    }
    if (save) { try { localStorage.setItem("lang", lang); } catch (e) {} }
  }
  var fromUrl = new URLSearchParams(location.search).get("lang");
  var saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  var browser = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  setLang(fromUrl || saved || browser, false);

  // Collapsible table of contents: each section with subsections gets a
  // toggle; the section being read opens by itself as you scroll.
  var navs = document.querySelectorAll(".toc nav");
  for (var n = 0; n < navs.length; n++) {
    var items = navs[n].querySelectorAll(":scope > ul > li");
    for (var k = 0; k < items.length; k++) {
      var li = items[k];
      if (!li.querySelector(":scope > ul")) { li.classList.add("no-sub"); continue; }
      li.classList.add("has-sub");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "toc-toggle";
      btn.setAttribute("aria-expanded", "false");
      btn.setAttribute("aria-label", "Show subsections");
      li.insertBefore(btn, li.firstChild);
    }
  }
  function setOpen(li, open) {
    li.classList.toggle("open", open);
    var b = li.querySelector(":scope > .toc-toggle");
    if (b) b.setAttribute("aria-expanded", open);
  }
  function setAllButton(nav) {
    var all = nav.querySelector("[data-toc-all]");
    var subs = nav.querySelectorAll("li.has-sub");
    var openCount = nav.querySelectorAll("li.has-sub.open").length;
    var allOpen = subs.length > 0 && openCount === subs.length;
    all.setAttribute("aria-pressed", allOpen);
    all.textContent = all.getAttribute(allOpen ? "data-close" : "data-open");
  }
  var current = null;
  function spy() {
    var lang = document.documentElement.getAttribute("data-current");
    var heads = document.querySelectorAll('article[data-lang="' + lang + '"] h2[id], article[data-lang="' + lang + '"] h3[id]');
    var id = null;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getBoundingClientRect().top < 120) id = heads[i].id; else break;
    }
    if (id === current) return;
    current = id;
    var nav = document.querySelector('.toc nav[data-lang="' + lang + '"]');
    var old = document.querySelectorAll(".toc a.active");
    for (var j = 0; j < old.length; j++) old[j].classList.remove("active");
    if (!id) return;
    var link = nav.querySelector('a[href="#' + id + '"]');
    if (!link) return;
    link.classList.add("active");
    var top = link.closest(".toc nav > ul > li");
    if (top && top.classList.contains("has-sub") && !top.classList.contains("open")) {
      setOpen(top, true);
      setAllButton(nav);
    }
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; spy(); });
  }, { passive: true });
  spy();
  document.addEventListener("click", function (ev) {
    var tg = ev.target.closest(".toc-toggle");
    if (tg) {
      var item = tg.parentNode;
      setOpen(item, !item.classList.contains("open"));
      setAllButton(item.closest("nav"));
      return;
    }
    var ta = ev.target.closest("[data-toc-all]");
    if (ta) {
      var nv = ta.closest("nav");
      var openAll = ta.getAttribute("aria-pressed") !== "true";
      var subs = nv.querySelectorAll("li.has-sub");
      for (var s = 0; s < subs.length; s++) setOpen(subs[s], openAll);
      setAllButton(nv);
      return;
    }
    var t = ev.target.closest("[data-code-toggle]");
    if (t) {
      var open = t.getAttribute("aria-pressed") !== "true";
      t.setAttribute("aria-pressed", open);
      t.querySelector('[data-lang="en"]').textContent = open ? "Collapse all code" : "Expand all code";
      t.querySelector('[data-lang="zh"]').textContent = open ? "收起全部代码" : "展开全部代码";
      var blocks = document.querySelectorAll("details.rcode");
      for (var i = 0; i < blocks.length; i++) blocks[i].open = open;
      return;
    }
    var b = ev.target.closest("[data-set-lang]");
    if (!b) return;
    var lang = b.getAttribute("data-set-lang");
    setLang(lang, true);
    var url = new URL(location.href);
    url.searchParams.set("lang", lang);
    url.hash = "";
    history.replaceState(null, "", url);
    window.scrollTo(0, 0);
    current = null;
    spy();
  });
})();
</script>
</body>
</html>
